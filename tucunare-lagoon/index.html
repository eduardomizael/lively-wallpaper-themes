    const pectLPivot2 = new THREE.Vector3(0.355, -0.19, 0.96);
    const pectRPivot2 = new THREE.Vector3(-0.355, -0.19, 0.96);
    const pelvLPivot2 = new THREE.Vector3(0.105, -0.69, 0.84);
    const pelvRPivot2 = new THREE.Vector3(-0.105, -0.69, 0.84);
    const eyeLPos2 = new THREE.Vector3(0.188, EYE_Y2, EYE_Z2);
    const eyeRPos2 = new THREE.Vector3(-0.188, EYE_Y2, EYE_Z2);

    const FISH_DEFORM_V2_GLSL = /* glsl */ `
      uniform float uSwimPhase;
      uniform float uTailAmp;
      uniform float uSpineCurve;
      uniform float uBreathPhase;
      uniform float uIdleDriftPhase;
      uniform float uMouthOpen;

      float fishLengthFraction2(float z) {
        return clamp((${glslF(HEAD_Z2)} - z) / ${glslF(HEAD_Z2 - CAUDAL_ROOT_Z2 + CAUDAL_LEN2 + 0.035)}, 0.0, 1.0);
      }

      float spineOffsetX2(float z) {
        float s = fishLengthFraction2(z);
        float wave = sin(uSwimPhase - s * 4.9);
        float amp = uTailAmp * (0.006 + 0.994 * pow(max(0.0, s - 0.10) / 0.90, 2.05));
        float swimX = wave * amp;
        float idleDrift = sin(uIdleDriftPhase - s * 3.2) * 0.035 * pow(s, 2.6);
        float ds = s - 0.25;
        float bendX = uSpineCurve * (ds * ds) * 2.45;
        return swimX + idleDrift + bendX;
      }

      vec3 deformFishPosition2(vec3 p) {
        float gillDist = (p.z - 1.1800) * 4.0;
        float gillMask = exp(-gillDist * gillDist);
        p.x *= (1.0 + gillMask * (0.042 * sin(uBreathPhase) + 0.11 * uMouthOpen));
        p.x += spineOffsetX2(p.z);
        return p;
      }

      vec3 deformFishNormal2(vec3 p, vec3 n) {
        float eps = 0.06;
        float dx = spineOffsetX2(p.z + eps) - spineOffsetX2(p.z - eps);
        float angle = atan(dx / (2.0 * eps));
        float c = cos(angle);
        float s = sin(angle);
        return normalize(vec3(n.x * c + n.z * s, n.y, -n.x * s + n.z * c));
      }
    `;

    function createPeacockBodyMaterial(fishUniforms) {
      return new THREE.ShaderMaterial({
        uniforms: {
          ...globalFishUniforms,
          ...fishUniforms
        },
        vertexShader: /* glsl */ `
          attribute vec2 anatomy;
          attribute vec4 aRelief;
          varying vec2 vUv;
          varying float vOralSurface;
          varying vec4 vRelief;
          varying vec3 vObjPos;
          varying vec3 vWorldPos;
          varying vec3 vWorldNormal;

          ${FISH_DEFORM_V2_GLSL}

          void main() {
            vUv = uv;
            vOralSurface = anatomy.y;
            vRelief = aRelief;
            vObjPos = position;
            vec3 p = position;
            vec3 n = normal;
            float upper = step(0.0, anatomy.x);
            float jawWeight = 1.0 - smoothstep(0.065, ${glslF(MOUTH_END2)}, uv.x);
            float jawMotion = uMouthOpen * jawWeight;
            float breath = (1.0 - upper) * jawWeight * (0.005 + 0.005 * sin(uBreathPhase));
            float angle = mix(-0.62, 0.13, upper) * jawMotion - breath;
            mat2 jawRotation = mat2(cos(angle), sin(angle), -sin(angle), cos(angle));
            vec2 hinge = vec2(${glslF(JAW_HINGE_Z2)}, ${glslF(JAW_HINGE_Y2)});
            p.zy = hinge + jawRotation * (p.zy - hinge);
            p.z += jawMotion * mix(-0.15, 0.066, upper);
            n.zy = jawRotation * n.zy;
            vec3 deformedPos = deformFishPosition2(p);
            vec3 deformedNorm = deformFishNormal2(p, n);

            vec4 wp = modelMatrix * vec4(deformedPos, 1.0);
            vWorldPos = wp.xyz;
            vWorldNormal = normalize(mat3(modelMatrix) * deformedNorm);

            gl_Position = projectionMatrix * viewMatrix * wp;
          }
        `,
        fragmentShader: /* glsl */ `
          uniform float uTime;
          uniform float uCausticsIntensity;
          varying vec2 vUv;
          varying float vOralSurface;
          varying vec4 vRelief;
          varying vec3 vObjPos;
          varying vec3 vWorldPos;
          varying vec3 vWorldNormal;

          ${CAUSTICS_GLSL}

          float hash21(vec2 p) {
            p = fract(p * vec2(123.34, 456.21));
            p += dot(p, p + 45.32);
            return fract(p.x * p.y);
          }

          float noise2D(vec2 p) {
            vec2 i = floor(p);
            vec2 f = fract(p);
            f = f * f * (3.0 - 2.0 * f);
            float a = hash21(i);
            float b = hash21(i + vec2(1.0, 0.0));
            float c = hash21(i + vec2(0.0, 1.0));
            float d = hash21(i + vec2(1.0, 1.0));
            return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
          }

          float bell(float x) {
            return exp(-x * x);
          }

          float oval(vec2 xy, vec2 center, vec2 radius) {
            vec2 p = (xy - center) / radius;
            return exp(-dot(p, p));
          }

          // Escamas cicloides maiores e com relevo nítido na borda posterior
          vec4 peacockScalePattern(vec2 grid) {
            float row = floor(grid.y);
            vec2 coord = vec2(grid.x + mod(row, 2.0) * 0.5, grid.y);
            vec2 cell = floor(coord);
            vec2 p = fract(coord);
            float arch = 0.68 - 0.90 * (p.y - 0.5) * (p.y - 0.5);
            float distEdge = fract(p.x - arch + 0.5) - 0.5;
            float ridge = bell(distEdge / 0.12);
            float edgeInk = bell((distEdge + 0.028) / 0.105);
            float plate = smoothstep(0.0, 0.55, -distEdge) * (0.74 + 0.26 * sin(p.y * 3.14159));
            return vec4(plate, ridge, hash21(cell), edgeInk);
          }

          // Barra vertical com topo arredondado e contorno orgânico irregular pelas escamas
          float darkBar2(float z, float y, float center, float width, float lowerEnd, float upperEnd, float leanSlope, float warp, float scaleEdge) {
            float topFade = 1.0 - smoothstep(upperEnd - 0.12, upperEnd + 0.05, y + warp * 0.35);
            float botFade = smoothstep(lowerEnd - 0.08, lowerEnd + 0.14, y + warp * 0.45);
            float pinch = 1.0 - 0.16 * bell((y - 0.05) / 0.22);
            float lean = (y - 0.10) * leanSlope;
            float dist = abs(z - center + lean + warp * 0.65) / (width * pinch);
            float edgeBreak = 0.15 * (scaleEdge - 0.35);
            return (1.0 - smoothstep(0.68 + edgeBreak, 1.08 + edgeBreak, dist)) * topFade * botFade;
          }

          // Pintinha escura com anel dourado ao redor (como na linha lateral da referência)
          void applyMiniOcellus(vec2 flank, vec2 center, float rad, float grain, inout vec3 albedo) {
            float d = length((flank - center) / vec2(rad * 1.15, rad)) + (grain - 0.5) * 0.14;
            float halo = 1.0 - smoothstep(0.85, 1.35, d);
            float spot = 1.0 - smoothstep(0.45, 0.72, d);
            albedo = mix(albedo, vec3(0.92, 0.78, 0.25), halo * 0.85);
            albedo = mix(albedo, vec3(0.03, 0.04, 0.03), spot * 0.96);
          }

          void main() {
            vec3 Ngeom = normalize(vWorldNormal);
            vec3 V = normalize(cameraPosition - vWorldPos);
            vec3 L = normalize(vec3(-0.38, 0.82, 0.43));
            vec3 H = normalize(L + V);
            float t = vUv.x;
            float y = vObjPos.y;
            float z = vObjPos.z;
            vec2 flank = vObjPos.zy;
            float head = 1.0 - smoothstep(0.18, 0.30, t);

            float cloud = noise2D(flank * vec2(2.6, 3.8));
            float mottle = noise2D(flank * vec2(7.8, 9.2));
            float grain = noise2D(flank * vec2(26.0, 28.0));
            float fineNoise = noise2D(flank * vec2(44.0, 44.0));
            float flankLight = (mottle - 0.5) * 0.45 + (cloud - 0.5) * 0.55;

            // Grade de escamas maiores (48 x 34) para volume e brilho legíveis
            vec2 grid = vec2(t * (48.0 + 8.0 * t), vUv.y * 34.0);
            vec4 scales = peacockScalePattern(grid);
            float scaleFade = (1.0 - smoothstep(0.35, 0.86, max(fwidth(grid.x), fwidth(grid.y)))) *
              mix(1.0, 0.06, head);

            // Paleta fiel à referência: dorso verde-musgo, flanco dourado e ventre laranja-tangerina vivo
            vec3 deepMoss = vec3(0.14, 0.28, 0.15);
            vec3 oliveBack = vec3(0.27, 0.46, 0.21);
            vec3 chartreuseShoulder = vec3(0.55, 0.64, 0.21);
            vec3 flankGold = vec3(0.84, 0.70, 0.17);
            vec3 warmAmber = vec3(0.90, 0.52, 0.13);
            vec3 bellyOrange = vec3(0.91, 0.29, 0.07);

            float colorY = y + flankLight * 0.11;
            vec3 albedo = mix(flankGold, chartreuseShoulder, smoothstep(0.08, 0.36, colorY));
            albedo = mix(albedo, oliveBack, smoothstep(0.30, 0.56, colorY));
            albedo = mix(albedo, deepMoss, smoothstep(0.52, 0.78, colorY));
            albedo = mix(albedo, warmAmber, 1.0 - smoothstep(-0.36, -0.06, colorY));
            albedo = mix(albedo, bellyOrange, 1.0 - smoothstep(-0.56, -0.26, colorY));

            // Bochecha amarelo-ouro brilhante e queixo/garganta laranja vivo
            float cheekZone = oval(flank, vec2(1.36, -0.09), vec2(0.54, 0.34));
            albedo = mix(albedo, vec3(0.93, 0.75, 0.19), cheekZone * 0.88);
            float throatZone = oval(flank, vec2(1.18, -0.44), vec2(0.92, 0.24));
            albedo = mix(albedo, vec3(0.93, 0.35, 0.08), throatZone * 0.82);

            // Testa/focinho superior verde-oliva descendo sobre o olho + anel orbital verde-esmeralda
            float snoutGreen = oval(flank, vec2(1.84, 0.17), vec2(0.42, 0.22)) * smoothstep(-0.02, 0.20, y);
            albedo = mix(albedo, vec3(0.30, 0.48, 0.24), snoutGreen * 0.85);
            float eyeRimVis = smoothstep(0.42, 0.85,
              oval(flank, vec2(${glslF(EYE_Z2)}, ${glslF(EYE_Y2 + 0.015)}), vec2(0.155, 0.142))) * (1.0 - vRelief.z);
            albedo = mix(albedo, vec3(0.22, 0.48, 0.22),
              eyeRimVis * smoothstep(-0.08, 0.14, y - ${glslF(EYE_Y2)}) * 0.65);

            // Pedúnculo caudal: transição verde em cima / laranja-âmbar embaixo
            float peduncle = smoothstep(0.78, 1.0, t);
            vec3 pedCol = mix(vec3(0.84, 0.42, 0.12), vec3(0.28, 0.47, 0.25), smoothstep(-0.08, 0.06, y));
            albedo = mix(albedo, pedCol, peduncle * 0.82);

            albedo *= 1.0 + flankLight * 0.26;

            // Contorno escuro em cada escama (malha visível no dorso verde e flanco dourado)
            float netStrength = smoothstep(-0.22, 0.24, y) * (1.0 - head * 0.92) * scaleFade;
            albedo *= 1.0 - scales.w * 0.30 * netStrength;
            albedo *= 1.0 + scaleFade * ((scales.z - 0.5) * 0.14 + scales.x * 0.09 - scales.y * 0.055);

            // As 3 barras pretas verticais características da imagem de referência
            float warp = (mottle - 0.5) * 0.16 + (grain - 0.5) * 0.07;
            float b1 = darkBar2(z, y, 0.28, 0.168, -0.52, 0.56, 0.08, warp, scales.w);
            float b2 = darkBar2(z, y, -0.34, 0.180, -0.55, 0.58, -0.10, warp, scales.w);
            float b3 = darkBar2(z, y, -0.96, 0.140, -0.43, 0.36, 0.12, warp * 1.15, scales.w) * 0.92;
            float bars = max(b1, max(b2, b3));

            // Manchas pretas irregulares atrás do olho e respingos na bochecha
            float cheekBlotchA = oval(vec2(z + warp * 0.45, y + (grain - 0.5) * 0.06), vec2(1.32, 0.04), vec2(0.20, 0.095));
            float cheekBlotchB = oval(vec2(z + warp * 0.35, y + (mottle - 0.5) * 0.05), vec2(1.12, 0.00), vec2(0.11, 0.065));
            float cheekBlotches = smoothstep(0.32, 0.55, max(cheekBlotchA, cheekBlotchB) + (mottle - 0.5) * 0.30);

            float spatterArea = oval(flank, vec2(1.26, -0.06), vec2(0.36, 0.20));
            float spatter = smoothstep(0.64, 0.72, grain * 0.72 + fineNoise * 0.38) * smoothstep(0.18, 0.55, spatterArea);
            float shoulderSpots = smoothstep(0.66, 0.74, mottle * 0.65 + grain * 0.42) *
              oval(flank, vec2(0.84, 0.00), vec2(0.18, 0.18));

            float marks = max(bars, max(cheekBlotches, max(spatter, shoulderSpots)));
            vec3 inkBlack = mix(vec3(0.032, 0.038, 0.028), vec3(0.075, 0.082, 0.050), grain);
            albedo = mix(albedo, inkBlack, min(1.0, marks) * 0.95);

            // Pintinhas com halo dourado próximas à linha lateral entre as barras (como na referência)
            applyMiniOcellus(flank, vec2(0.00, 0.16), 0.045, grain, albedo);
            applyMiniOcellus(flank, vec2(-0.64, 0.21), 0.040, grain, albedo);
            applyMiniOcellus(flank, vec2(-0.78, 0.16), 0.038, grain, albedo);
            applyMiniOcellus(flank, vec2(0.18, 0.57), 0.036, grain, albedo);

            // Linha lateral, guelras com aba carnosa + fenda branquial profunda, narina e órbita
            float latLineY = 0.08 + 0.17 * sin(clamp((t - 0.22) / 0.56, 0.0, 1.0) * 3.14159);
            float lateral = bell((y - latLineY) / 0.008) * smoothstep(0.26, 0.35, t) * (1.0 - smoothstep(0.68, 0.76, t));
            albedo *= 1.0 - lateral * (0.14 + 0.18 * grain);

            float gillZ = 1.06 + 0.42 * (y + 0.10) * (y + 0.10) + 0.20 * y;
            float gillLength = smoothstep(-0.56, -0.34, y) * (1.0 - smoothstep(0.18, 0.36, y));
            float opFlangeRim = bell((z - gillZ - 0.065) / 0.055) * gillLength;
            float gillFold = bell((z - gillZ) / 0.022) * gillLength;
            albedo = mix(albedo, vec3(0.94, 0.62, 0.22), opFlangeRim * 0.42);
            albedo = mix(albedo, vec3(0.32, 0.11, 0.04), gillFold * 0.55);
            albedo = mix(albedo, vec3(0.16, 0.04, 0.02), vRelief.y * 0.92);

            float eyeSocket = oval(flank, vec2(${glslF(EYE_Z2)}, ${glslF(EYE_Y2)}), vec2(0.132, 0.118));
            float nostril = oval(flank, vec2(${glslF(EYE_Z2 + 0.24)}, ${glslF(EYE_Y2 - 0.04)}), vec2(0.026, 0.018));
            albedo *= 1.0 - eyeSocket * 0.34 - nostril * 0.62;
            albedo *= 1.0 - vRelief.z * 0.55 - vRelief.w * 0.38;
            albedo *= 1.0 + head * (grain - 0.5) * 0.12;

            // Lábios carnosos dourado-alaranjados com fenda bucal profunda
            float lipY = (${glslF(MOUTH_TIP_Y2)} - ${glslF(MOUTH_SLOPE2)} * min(t, ${glslF(MOUTH_END2)})) *
              (1.0 - smoothstep(${glslF(MOUTH_END2)}, ${glslF(MOUTH_SETTLE2)}, t));
            float lipMask = 1.0 - smoothstep(0.105, ${glslF(MOUTH_END2)}, t);
            float lipCrease = bell((y - lipY) / 0.014) * lipMask;
            float lips = bell((y - lipY) / 0.058) * lipMask;
            float lipHighlight = bell((y - lipY + 0.028) / 0.022) * lipMask;
            albedo = mix(albedo, vec3(0.88, 0.58, 0.21), lips * 0.70);
            albedo = mix(albedo, vec3(0.14, 0.06, 0.03), max(lipCrease * 0.65, vRelief.x * 0.88));
            albedo += vec3(0.10, 0.06, 0.02) * lipHighlight * (1.0 - vRelief.x);

            // Bump map mais marcado das escamas 3D
            float height = (scales.x + scales.y * 0.30) * scaleFade * 0.013;
            vec3 dPdx = dFdx(vWorldPos);
            vec3 dPdy = dFdy(vWorldPos);
            vec3 surfaceGradient = normalize(cross(dPdy, Ngeom)) * dFdx(height) +
              normalize(cross(Ngeom, dPdx)) * dFdy(height);
            vec3 N = normalize(Ngeom - surfaceGradient * 13.5);

            // Oclusão ambiental real das cavidades (boca, guelra, órbita e sulcos ósseos)
            float creviceAO = clamp(vRelief.x * 0.82 + vRelief.y * 0.90 + vRelief.z * 0.65 + vRelief.w * 0.52, 0.0, 0.94);

            // Iluminação úmida com duplo lóbulo especular e rebote subaquático
            float diff = max(dot(N, L), 0.0);
            float fresnel = pow(1.0 - max(dot(N, V), 0.0), 3.0);
            float wetBroad = pow(max(dot(N, H), 0.0), 22.0) * 0.18;
            float wetSharp = pow(max(dot(N, H), 0.0), 96.0) * (0.28 + scaleFade * scales.x * 0.28);
            vec3 illumination = mix(vec3(0.50, 0.58, 0.54), vec3(0.84, 0.90, 0.84), Ngeom.y * 0.5 + 0.5);
            vec3 color = albedo * (illumination + vec3(0.62, 0.57, 0.45) * diff) * (1.0 - creviceAO * 0.62);

            // Brilho úmido sobre escamas e barras + contorno subaquático frio sob o queixo/ventre
            float specMask = (1.0 - min(1.0, marks) * 0.38) * (1.0 - creviceAO * 0.95);
            float sheen = smoothstep(0.02, 0.62, y) * (0.28 + 0.72 * (1.0 - head));
            color += vec3(0.36, 0.66, 0.52) * sheen * (0.07 + wetBroad * 0.45) * (1.0 - creviceAO * 0.85);
            color += vec3(1.00, 0.98, 0.92) * (wetBroad * 0.42 + wetSharp) * specMask;
            float chinRim = fresnel * (1.0 - smoothstep(-0.58, 0.05, Ngeom.y)) * smoothstep(0.15, 1.8, z);
            color += vec3(0.55, 0.92, 0.95) * (fresnel * 0.08 + chinRim * 0.36) * (1.0 - creviceAO * 0.80);

            float caustics = layeredCaustics(vWorldPos.xz * 1.05, uTime * 1.05);
            color += vec3(0.38, 0.80, 0.73) * caustics * 0.16 * uCausticsIntensity *
              smoothstep(-0.22, 0.76, Ngeom.y) * (1.0 - creviceAO * 0.75);

            if (vOralSurface > 0.5) {
              vec3 mouthCol = mix(vec3(0.32, 0.12, 0.09), vec3(0.07, 0.03, 0.03), smoothstep(0.015, 0.15, t));
              float gum = smoothstep(0.35, 0.49, abs(vUv.y - 0.5)) * (1.0 - smoothstep(0.06, 0.16, t));
              float lipRimCol = 0.78 * (1.0 - smoothstep(0.006, 0.055, t));
              color = mix(mouthCol, vec3(0.55, 0.30, 0.16), max(gum, lipRimCol));
              color += vec3(0.24, 0.11, 0.08) * wetBroad;
            }

            float waterAbsorb = clamp((length(cameraPosition - vWorldPos) - 13.0) * 0.012, 0.020, 0.24);
            color = mix(color, vec3(0.07, 0.26, 0.29), waterAbsorb);

            gl_FragColor = vec4(color, 1.0);
          }
        `
      });
    }

    // Olho realista encaixado na órbita com íris vermelho-rubi profunda, borda escura e brilho vítreo
    function createPeacockEyeMaterial(fishUniforms, sideSign, eyeOffset) {
      return new THREE.ShaderMaterial({
        uniforms: {
          ...fishUniforms,
          uSideSign: { value: sideSign },
          uEyeOffset: { value: eyeOffset.clone() }
        },
        vertexShader: /* glsl */ `
          uniform vec3 uEyeOffset;
          varying vec3 vLocalNorm;
          varying vec3 vWorldPos;
          varying vec3 vWorldNormal;
          ${FISH_DEFORM_V2_GLSL}
          void main() {
            vLocalNorm = normalize(normal);
            vec3 p = position + uEyeOffset;
            vec3 dp = deformFishPosition2(p);
            vec3 dn = deformFishNormal2(p, normal);
            vec4 wp = modelMatrix * vec4(dp, 1.0);
            vWorldPos = wp.xyz;
            vWorldNormal = normalize(mat3(modelMatrix) * dn);
            gl_Position = projectionMatrix * viewMatrix * wp;
          }
        `,
        fragmentShader: /* glsl */ `
          uniform float uSideSign;
          varying vec3 vLocalNorm;
          varying vec3 vWorldPos;
          varying vec3 vWorldNormal;
          void main() {
            vec3 nLoc = normalize(vLocalNorm);
            vec3 gaze = normalize(vec3(uSideSign * 0.94, 0.04, 0.24));
            vec3 tangent = normalize(cross(vec3(0.0, 1.0, 0.0), gaze));
            vec3 up = cross(gaze, tangent);
            float r = acos(clamp(dot(nLoc, gaze), -1.0, 1.0));
            float ang = atan(dot(nLoc, up), dot(nLoc, tangent));
            float fibers = 0.86 + 0.09 * sin(ang * 26.0 + sin(ang * 6.0)) + 0.05 * sin(ang * 41.0);

            // Transição escura com a pálpebra -> anel externo prateado sutil -> íris rubi profunda -> pupila
            vec3 col = mix(vec3(0.08, 0.09, 0.07), vec3(0.54, 0.50, 0.42), 1.0 - smoothstep(0.68, 0.80, r));
            col = mix(col, vec3(0.72, 0.12, 0.07) * fibers, 1.0 - smoothstep(0.58, 0.67, r));
            col = mix(col, vec3(0.88, 0.26, 0.10) * fibers, 1.0 - smoothstep(0.39, 0.48, r));
            col = mix(col, vec3(0.012, 0.014, 0.016), 1.0 - smoothstep(0.325, 0.385, r));

            vec3 N = normalize(vWorldNormal);
            vec3 V = normalize(cameraPosition - vWorldPos);
            vec3 L = normalize(vec3(-0.38, 0.82, 0.43));
            float diff = 0.74 + 0.26 * max(dot(N, L), 0.0);
            float reflex = max(dot(N, normalize(L + V)), 0.0);
            float spec = pow(reflex, 128.0) * 1.15 + pow(reflex, 28.0) * 0.10;
            gl_FragColor = vec4(col * diff + vec3(0.96, 0.98, 1.0) * spec, 1.0);
          }
        `
      });
    }

    // Nadadeiras fiéis à referência (cauda bicolor verde/vermelho com ocelo grande, dorsal verde-sálvia, anal e pélvicas laranja-vermelho)
    function createPeacockFinMaterial(fishUniforms, finType, sideSign = 0, pivot = new THREE.Vector3()) {
      return new THREE.ShaderMaterial({
        uniforms: {
          ...globalFishUniforms,
          ...fishUniforms,
          uFinType: { value: finType },
          uSideSign: { value: sideSign },
          uPivot: { value: pivot.clone() }
        },
        transparent: true,
        depthWrite: false,
        side: THREE.DoubleSide,
        vertexShader: /* glsl */ `
          uniform int uFinType;
          uniform float uSideSign;
          uniform vec3 uPivot;
          uniform float uPectoralSpread;
          uniform float uPectoralRowL;
          uniform float uPectoralRowR;
          uniform float uDorsalFlare;
          uniform float uTime;

          varying vec2 vUv;
          varying vec3 vWorldPos;
          varying vec3 vWorldNormal;

          ${FISH_DEFORM_V2_GLSL}

          void main() {
            vUv = uv;
            vec3 p = position;
            vec3 n = normal;

            if (uFinType == 0) {
              float edgeLag = abs(uv.y - 0.5) * 0.45;
              float whip = sin(uSwimPhase - 4.7 - uv.x * 2.15 - edgeLag) * (uTailAmp * 0.30) * pow(uv.x, 1.45);
              float silkTip = sin(uIdleDriftPhase - uv.x * 2.8 - uv.y * 1.8) * 0.032 * pow(uv.x, 1.8);
              p.x += whip + silkTip;
            } else if (uFinType == 1) {
              float flareScale = mix(0.62, 1.06, uDorsalFlare);
              float baseY = p.y - uv.y * 0.45;
              p.y = mix(p.y, baseY + uv.y * 0.45 * flareScale, uv.y);
              float sBody = fishLengthFraction2(p.z);
              p.x += sin(uSwimPhase - sBody * 4.9 - uv.y * 0.7) * (uTailAmp * 0.14 + 0.015) * uv.y;
            } else if (uFinType == 2 || uFinType == 3) {
              float sBody = fishLengthFraction2(p.z);
              float wave = sin(uSwimPhase - sBody * 4.9 - uv.y * 1.25 - uv.x * 1.1) * (uTailAmp * 0.25 + 0.032) * uv.y;
              p.x += wave;
            } else if (uFinType == 4) {
              float row = (uSideSign > 0.0) ? uPectoralRowL : uPectoralRowR;
              float phaseLag = uv.y * 1.35;
              float angleY = uSideSign * (uPectoralSpread + row * cos(phaseLag));
              float featherZ = sin(uTime * 4.6 + (uSideSign > 0.0 ? 0.0 : 3.14159) - phaseLag) * 0.095 * uv.x;
              float c = cos(angleY);
              float s = sin(angleY);
              vec3 q = vec3(p.x * c - p.z * s, p.y + featherZ, p.x * s + p.z * c);
              p = uPivot + q;
              n = vec3(n.x * c - n.z * s, n.y, n.x * s + n.z * c);
            } else if (uFinType == 5) {
              float tuck = mix(0.36, 0.0, clamp(uPectoralSpread * 1.4, 0.0, 1.0));
              float c = cos(tuck);
              float s = sin(tuck);
              vec3 q = vec3(p.x, p.y * c - p.z * s, p.y * s + p.z * c);
              p = uPivot + q;
              n = vec3(n.x, n.y * c - n.z * s, n.y * s + n.z * c);
            }

            vec3 dp = deformFishPosition2(p);
            vec3 dn = deformFishNormal2(p, n);

            vec4 wp = modelMatrix * vec4(dp, 1.0);
            vWorldPos = wp.xyz;
            vWorldNormal = normalize(mat3(modelMatrix) * dn);
            gl_Position = projectionMatrix * viewMatrix * wp;
          }
        `,
        fragmentShader: /* glsl */ `
          uniform int uFinType;
          uniform float uTime;
          uniform float uCausticsIntensity;
          varying vec2 vUv;
          varying vec3 vWorldPos;
          varying vec3 vWorldNormal;

          ${CAUSTICS_GLSL}

          float hash21(vec2 p) {
            p = fract(p * vec2(127.1, 311.7));
            p += dot(p, p + 41.3);
            return fract(p.x * p.y);
          }

          float edgeFade(float coord, float width) {
            return smoothstep(0.0, width, coord) * (1.0 - smoothstep(1.0 - width, 1.0, coord));
          }

          float finRays(float coord, float count, float offset) {
            float band = coord * count + offset;
            float ray = 1.0 - smoothstep(0.08, 0.29, abs(fract(band) - 0.5));
            return mix(ray, 0.28, smoothstep(0.35, 0.96, fwidth(band)));
          }

          void main() {
            float u = vUv.x;
            float v = vUv.y;
            bool radial = uFinType == 0 || uFinType >= 4;
            float reach = radial ? u : v;
            float across = radial ? v : u;
            float rayCount = 18.0;
            float opacity = 0.88;
            vec3 col;

            if (uFinType == 0) {
              // Cauda bicolor: verde-oliva translúcido em cima + laranja-vermelho estriado embaixo
              float split = smoothstep(0.43, 0.49, v + 0.02 * sin(u * 4.0));
              vec3 upper = mix(vec3(0.26, 0.46, 0.26), vec3(0.40, 0.56, 0.36), smoothstep(0.08, 0.80, u));
              vec3 lower = mix(vec3(0.84, 0.34, 0.09), vec3(0.90, 0.26, 0.07), smoothstep(0.05, 0.78, u));
              col = mix(lower, upper, split);
              rayCount = 26.0;
              opacity = mix(0.95, 0.86, split);
            } else if (uFinType == 1) {
              // Dorsal espinhosa verde-sálvia pálida translúcida
              col = mix(vec3(0.32, 0.47, 0.27), vec3(0.48, 0.59, 0.40), smoothstep(0.05, 0.88, v));
              rayCount = 10.0;
              opacity = 0.82;
            } else if (uFinType == 2) {
              // Dorsal mole verde-oliva luminosa
              col = mix(vec3(0.30, 0.45, 0.26), vec3(0.44, 0.58, 0.36), smoothstep(0.08, 0.90, v));
              rayCount = 18.0;
              opacity = 0.84;
            } else if (uFinType == 3) {
              // Anal laranja-vermelho vivo com raios definidos
              col = mix(vec3(0.84, 0.34, 0.10), vec3(0.93, 0.28, 0.08), smoothstep(0.08, 0.85, v));
              col = mix(col, vec3(0.96, 0.60, 0.34), (1.0 - smoothstep(0.02, 0.14, u)) * 0.45);
              rayCount = 16.0;
              opacity = 0.93;
            } else if (uFinType == 4) {
              // Peitoral âmbar-dourado translúcido
              col = mix(vec3(0.84, 0.62, 0.22), vec3(0.93, 0.80, 0.48), smoothstep(0.10, 0.96, u));
              rayCount = 14.0;
              opacity = 0.72;
            } else {
              // Pélvica longa laranja-vermelha com borda frontal clara
              col = mix(vec3(0.84, 0.34, 0.10), vec3(0.91, 0.26, 0.08), smoothstep(0.08, 0.90, u));
              col = mix(col, vec3(0.96, 0.66, 0.42), (1.0 - smoothstep(0.01, 0.14, v)) * 0.55);
              rayCount = 10.0;
              opacity = 0.94;
            }

            float rayBend = uFinType == 1 ? 0.26 : 0.22 * sin(across * 5.0) * reach;
            float rays = finRays(across, rayCount, rayBend);
            float fiberGrain = hash21(floor(vec2(across * rayCount, reach * 20.0)) + float(uFinType) * 19.0);
            float rayContrast = (uFinType == 0 && v < 0.47) || uFinType == 3 || uFinType == 5 ? 0.32 : 0.20;
            col *= 0.84 + rayContrast * rays + (fiberGrain - 0.5) * 0.08;

            // Ocelos na cauda: grande na transição verde/laranja + menor atrás/acima
            float ocellusMask = 0.0;
            if (uFinType == 0) {
              float dMain = length((vUv - vec2(0.21, 0.52)) / vec2(0.078, 0.072));
              float haloMain = 1.0 - smoothstep(0.84, 1.18, dMain);
              float coreMain = 1.0 - smoothstep(0.58, 0.74, dMain);
              col = mix(col, vec3(0.92, 0.78, 0.24), haloMain * 0.92);
              col = mix(col, vec3(0.025, 0.032, 0.024), coreMain);

              float dSec = length((vUv - vec2(0.37, 0.64)) / vec2(0.036, 0.033));
              float haloSec = 1.0 - smoothstep(0.82, 1.24, dSec);
              float coreSec = 1.0 - smoothstep(0.48, 0.68, dSec);
              col = mix(col, vec3(0.92, 0.80, 0.28), haloSec * 0.85);
              col = mix(col, vec3(0.03, 0.035, 0.025), coreSec * 0.95);
              ocellusMask = max(haloMain, haloSec);
            }

            float edge = edgeFade(across, 0.042) * (1.0 - smoothstep(0.95, 1.0, reach));
            float alpha = max(opacity, ocellusMask * 0.96) * edge * mix(1.0, 0.82, reach) * (0.86 + 0.14 * rays);

            vec3 N = normalize(vWorldNormal);
            vec3 V = normalize(cameraPosition - vWorldPos);
            vec3 L = normalize(vec3(-0.38, 0.82, 0.43));
            float transmit = 0.34 * abs(dot(N, L)) + 0.14 * max(0.0, dot(vec3(0.0, 1.0, 0.0), L));
            float rim = pow(1.0 - abs(dot(N, V)), 2.5);
            float specExp = uFinType >= 4 ? 32.0 : 40.0;
            float specStrength = uFinType >= 4 ? 0.19 : 0.12;
            float spec = pow(abs(dot(N, normalize(L + V))), specExp) * (specStrength + 0.16 * rays);
            col *= 0.74 + transmit;
            col += vec3(0.74, 0.90, 0.78) * (spec + rim * 0.08);

            float caustics = layeredCaustics(vWorldPos.xz * 1.05, uTime * 1.05);
            col += vec3(0.38, 0.80, 0.73) * caustics * 0.11 * uCausticsIntensity;
            float waterAbsorb = clamp((length(cameraPosition - vWorldPos) - 13.0) * 0.012, 0.020, 0.24);
            col = mix(col, vec3(0.07, 0.26, 0.29), waterAbsorb);

            gl_FragColor = vec4(col, alpha);
          }
        `
      });
    }

    function createPeacockShadowMaterial(fishUniforms) {
      return new THREE.ShaderMaterial({
        uniforms: {
          ...globalFishUniforms,
          ...fishUniforms,
          uShadowOpacity: { value: 0.28 }
        },
        transparent: true,
        depthWrite: false,
        side: THREE.DoubleSide,
        vertexShader: /* glsl */ `
          uniform float uTime;
          varying vec2 vShadowUv;
          ${FISH_DEFORM_V2_GLSL}
          void main() {
            vShadowUv = uv;
            vec3 p = position;
            p.x += spineOffsetX2(p.z);
            p.x += sin(p.z * 1.3 + uTime * 1.5) * 0.04;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
          }
        `,
        fragmentShader: /* glsl */ `
          uniform float uShadowOpacity;
          varying vec2 vShadowUv;
          void main() {
            vec2 d = (vShadowUv - vec2(0.5, 0.5)) * 2.0;
            float taper = mix(1.0, 1.8, smoothstep(0.45, 1.0, vShadowUv.y));
            float dist = length(vec2(d.x * taper, d.y));
            float soft = exp(-dist * dist * 3.0) * smoothstep(1.0, 0.35, dist);
            gl_FragColor = vec4(0.012, 0.058, 0.068, uShadowOpacity * soft);
          }
        `
      });
    }

    function createPeacockBass() {
      const fishUniforms = {
        uSwimPhase: { value: 1.4 },
        uTailAmp: { value: 0.14 },
        uSpineCurve: { value: 0.0 },
        uPectoralSpread: { value: 0.42 },
        uPectoralRowL: { value: 0.0 },
        uPectoralRowR: { value: 0.0 },
        uDorsalFlare: { value: 0.72 },
        uBreathPhase: { value: 0.8 },
        uIdleDriftPhase: { value: 1.1 },
        uMouthOpen: { value: 0.0 }
      };

      const group = new THREE.Group();
      group.rotation.order = 'YXZ';
      scene.add(group);

      const bodyMesh = new THREE.Mesh(peacockGeos.body, createPeacockBodyMaterial(fishUniforms));
      bodyMesh.renderOrder = 4;
      group.add(bodyMesh);

      const caudalMesh = new THREE.Mesh(peacockGeos.caudal, createPeacockFinMaterial(fishUniforms, 0));
      caudalMesh.renderOrder = 5;
      group.add(caudalMesh);

      const spinyDorsalMesh = new THREE.Mesh(peacockGeos.spinyDorsal, createPeacockFinMaterial(fishUniforms, 1));
      spinyDorsalMesh.renderOrder = 5;
      group.add(spinyDorsalMesh);

      const softDorsalMesh = new THREE.Mesh(peacockGeos.softDorsal, createPeacockFinMaterial(fishUniforms, 2));
      softDorsalMesh.renderOrder = 5;
      group.add(softDorsalMesh);

      const analMesh = new THREE.Mesh(peacockGeos.anal, createPeacockFinMaterial(fishUniforms, 3));
      analMesh.renderOrder = 5;
      group.add(analMesh);

      const pectLMesh = new THREE.Mesh(peacockGeos.pectL, createPeacockFinMaterial(fishUniforms, 4, 1, pectLPivot2));
      pectLMesh.renderOrder = 6;
      group.add(pectLMesh);

      const pectRMesh = new THREE.Mesh(peacockGeos.pectR, createPeacockFinMaterial(fishUniforms, 4, -1, pectRPivot2));
      pectRMesh.renderOrder = 6;
      group.add(pectRMesh);

      const pelvLMesh = new THREE.Mesh(peacockGeos.pelvL, createPeacockFinMaterial(fishUniforms, 5, 1, pelvLPivot2));
      pelvLMesh.renderOrder = 5;
      group.add(pelvLMesh);

      const pelvRMesh = new THREE.Mesh(peacockGeos.pelvR, createPeacockFinMaterial(fishUniforms, 5, -1, pelvRPivot2));
      pelvRMesh.renderOrder = 5;
      group.add(pelvRMesh);

      const eyeLMesh = new THREE.Mesh(peacockGeos.eye, createPeacockEyeMaterial(fishUniforms, 1, eyeLPos2));
      eyeLMesh.renderOrder = 5;
      group.add(eyeLMesh);

      const eyeRMesh = new THREE.Mesh(peacockGeos.eye, createPeacockEyeMaterial(fishUniforms, -1, eyeRPos2));
      eyeRMesh.renderOrder = 5;
      group.add(eyeRMesh);

      const shadowGroup = new THREE.Group();
      scene.add(shadowGroup);
      const shadowMat = createPeacockShadowMaterial(fishUniforms);
      const shadowPlaneGeo = new THREE.PlaneGeometry(1.70, 5.5, 8, 28);
      shadowPlaneGeo.rotateX(-Math.PI / 2);
      const shadowBody = new THREE.Mesh(shadowPlaneGeo, shadowMat);
      shadowBody.renderOrder = 1;
      shadowGroup.add(shadowBody);

      return {
        id: 2,
        uniforms: fishUniforms,
        group,
        shadowGroup,
        shadowMat,

        pos: isInspect ? new THREE.Vector3(0.0, 0.0, 0.0) : new THREE.Vector3(2.2, -0.22, -0.65),
        targetY: -0.22,
        velY: 0,
        heading: -Math.PI * 0.48,
        pitch: 0,
        roll: 0,
        speed: isInspect ? 0.0 : 1.25,
        prevSpeed: 1.25,
        acceleration: 0,
        angularVelocity: 0,

        state: 'PATROL',
        stateTimer: 0,
        hoverDuration: 0,
        nextHoverIn: 5.4,
        strikeDuration: 0.40,
        fleeTimer: 0,
        fleeCooldown: 0,
        fleeHeadingOffset: 0,

        kickCycleTimer: 1.2,
        kickBurstLeft: 0.35,

        waypoint: new THREE.Vector3(-4.4, 0.2, 0.45),
        waypointTimer: 0,
        curiosityOrbitSign: -1,

        swimPhase: 1.4,
        breathPhase: 0.8,
        idleDriftPhase: 1.1,
        smoothEffort: 0.22,
        smoothSpineCurve: 0,
        smoothPectSpread: 0.42,
        smoothDorsalFlare: 0.72,
        pectRowPhase: 1.2,
        smoothMouthOpen: 0,
        biteSnapTimer: 0
      };
    }

    const tucunareRealista = createPeacockBass();
    const allFish = [tucunare, tucunareRealista];
    const piranha = !isInspect || isPiranhaProfile || isFishTrio
      ? createPiranhaModel(CAUSTICS_GLSL, globalFishUniforms)
      : null;
    if (piranha) scene.add(piranha);

    function posePiranha(time) {
      if (!piranha) return;
      const bob = Math.sin(time * 1.24) * 0.060;
      if (isPiranhaProfile) {
        piranha.position.set(0, bob, 0);
        piranha.rotation.y = -1.22 + Math.sin(time * 0.48) * 0.24;
        return;
      }
      if (isFishTrio) {
        piranha.position.set(3.58, 0.15 + bob, -0.46);
      } else {
        const laneX = Math.min(swimVolume.halfX * 0.51, 3.55);
        piranha.position.set(laneX + Math.sin(time * 0.51) * 0.32, 1.17 + bob, -3.8);
      }
      piranha.rotation.y = -1.43 + Math.sin(time * 0.69) * 0.13;
    }

    // =========================================================================
    // 7. SISTEMA DE ISCAS + BOLHAS DE BOTE
    // =========================================================================
    const baits = [];
    const MAX_BAITS = 8;

    const baitGeo = new THREE.SphereGeometry(0.13, 12, 10);
    const baitMat = new THREE.MeshStandardMaterial({
      color: 0xe6a854,
      roughness: 0.48,
      metalness: 0.15,
      emissive: 0x422406,
      emissiveIntensity: 0.35
    });

    const biteBubbles = [];
    const bubbleGeo = new THREE.SphereGeometry(0.055, 8, 6);
    const bubbleMat = new THREE.MeshBasicMaterial({
      color: 0xc8faf2,
      transparent: true,
      opacity: 0.68,
      depthWrite: false
    });

    function spawnStrikeSplash(x, y, z) {
      spawnRipple(x, z, 1.35);
      for (let i = 0; i < 11; i++) {
        const mesh = new THREE.Mesh(bubbleGeo, bubbleMat.clone());
        const ang = Math.random() * Math.PI * 2;
        const spd = 0.55 + Math.random() * 1.45;
        mesh.position.set(x, y, z);
        mesh.scale.setScalar(0.5 + Math.random() * 1.0);
        mesh.renderOrder = 14;
        scene.add(mesh);
        biteBubbles.push({
          mesh,
          vx: Math.cos(ang) * spd,
          vy: 0.9 + Math.random() * 1.35,
          vz: Math.sin(ang) * spd,
          life: 0,
          maxLife: 0.75 + Math.random() * 0.55
        });
      }
    }

    function spawnBait(x, z) {
      const cx = THREE.MathUtils.clamp(x, -swimVolume.halfX * 0.90, swimVolume.halfX * 0.90);
      const cz = THREE.MathUtils.clamp(z, swimVolume.minZ * 0.85, swimVolume.maxZ * 0.85);
      if (baits.length >= MAX_BAITS) {
        const oldest = baits.shift();
        scene.remove(oldest.mesh);
      }
      const mesh = new THREE.Mesh(baitGeo, baitMat);
      mesh.scale.set(1.25, 0.72, 0.82);
      mesh.position.set(cx, 2.3, cz);
      mesh.renderOrder = 10;
      scene.add(mesh);

      spawnRipple(cx, cz, 0.95);
      baits.push({
        mesh,
        pos: new THREE.Vector3(cx, 2.3, cz),
        targetY: -0.20 + Math.random() * 1.20,
        age: 0,
        seed: Math.random() * Math.PI * 2
      });
    }

    function updateBaitsAndBubbles(dt) {
      for (let i = baits.length - 1; i >= 0; i--) {
        const b = baits[i];
        b.age += dt;
        b.pos.y = THREE.MathUtils.lerp(b.pos.y, b.targetY + Math.sin(clockTime * 2.8 + b.seed) * 0.14, Math.min(1, dt * 1.4));
        b.pos.x += Math.sin(clockTime * 1.6 + b.seed) * 0.10 * dt;
        b.mesh.position.copy(b.pos);
        b.mesh.rotation.y += dt * 1.4;
        if (b.age > 32.0) {
          scene.remove(b.mesh);
          baits.splice(i, 1);
        }
      }

      for (let i = biteBubbles.length - 1; i >= 0; i--) {
        const p = biteBubbles[i];
        p.life += dt;
        p.mesh.position.x += p.vx * dt;
        p.mesh.position.y += p.vy * dt;
        p.mesh.position.z += p.vz * dt;
        p.vx *= 0.94;
        p.vz *= 0.94;
        const remain = 1.0 - p.life / p.maxLife;
        p.mesh.material.opacity = Math.max(0, remain * 0.68);
        if (p.life >= p.maxLife) {
          scene.remove(p.mesh);
          p.mesh.material.dispose();
          biteBubbles.splice(i, 1);
        }
      }
    }

    // =========================================================================
    // 8. INTERAÇÃO COM MOUSE
    // =========================================================================
    const mouse = {
      world: new THREE.Vector3(999, 0, 999),
      inside: false,
      stillTime: 0,
      speed: 0,
      moving: false,
      moveCooldown: 0,
      lastRipplePos: new THREE.Vector2(999, 999),
      lastRippleTime: -10
    };

    const raycaster = new THREE.Raycaster();
    const pointerNdc = new THREE.Vector2();
    const midPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
    const hitPoint = new THREE.Vector3();

    function projectPointer(clientX, clientY) {
      pointerNdc.x = (clientX / window.innerWidth) * 2 - 1;
      pointerNdc.y = -(clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointerNdc, camera);
      if (raycaster.ray.intersectPlane(midPlane, hitPoint)) {
        return {
          x: THREE.MathUtils.clamp(hitPoint.x, -swimVolume.halfX, swimVolume.halfX),
          z: THREE.MathUtils.clamp(hitPoint.z, swimVolume.minZ, swimVolume.maxZ)
        };
      }
      return null;
    }

    window.addEventListener('pointermove', (e) => {
      if (!params.interactiveMouse || isInspect) return;
      const pt = projectPointer(e.clientX, e.clientY);
      if (!pt) return;
      const movedDist = Math.hypot(pt.x - mouse.world.x, pt.z - mouse.world.z);
      mouse.world.set(pt.x, 0.1, pt.z);
      mouse.inside = true;

      if (movedDist > 0.08 && movedDist < 10.0) {
        mouse.speed = Math.min(28, movedDist * 32);
        mouse.moving = true;
        mouse.moveCooldown = 0.28;
        mouse.stillTime = 0;

        const dRip = Math.hypot(pt.x - mouse.lastRipplePos.x, pt.z - mouse.lastRipplePos.y);
        if (dRip > 0.65 || clockTime - mouse.lastRippleTime > 0.11) {
          spawnRipple(pt.x, pt.z, THREE.MathUtils.clamp(0.16 + movedDist * 0.22, 0.18, 0.42));
          mouse.lastRipplePos.set(pt.x, pt.z);
          mouse.lastRippleTime = clockTime;
        }
      } else if (movedDist >= 10.0) {
        mouse.lastRipplePos.set(pt.x, pt.z);
      }
    });

    window.addEventListener('pointerleave', () => {
      mouse.inside = false;
      mouse.stillTime = 0;
      mouse.moving = false;
    });

    window.addEventListener('pointerdown', (e) => {
      if (!params.interactiveMouse || isInspect) return;
      if (e.target.closest && e.target.closest('.lil-gui')) return;
      const pt = projectPointer(e.clientX, e.clientY);
      if (!pt) return;
      mouse.world.set(pt.x, 0.1, pt.z);
      mouse.inside = true;
      spawnBait(pt.x, pt.z);
    });

    function updateMouseState(dt) {
      if (!params.interactiveMouse || !mouse.inside) {
        mouse.stillTime = 0;
        mouse.moving = false;
        mouse.speed = 0;
        return;
      }
      if (mouse.moveCooldown > 0) {
        mouse.moveCooldown -= dt;
        if (mouse.moveCooldown <= 0) mouse.moving = false;
      } else {
        mouse.stillTime += dt;
      }
      mouse.speed = THREE.MathUtils.lerp(mouse.speed, 0, Math.min(1, dt * 10));
    }

    // =========================================================================
    // 9. LOCOMOÇÃO NATURAL DO TUCUNARÉ (KICK-AND-GLIDE + ESPAIRAR + ESPREITA + BOTE)
    // =========================================================================
    function normalizeAngle(a) {
      while (a > Math.PI) a -= Math.PI * 2;
      while (a < -Math.PI) a += Math.PI * 2;
      return a;
    }

    function pickPatrolWaypoint(fish) {
      const targetSide = fish.pos.x > 0 ? -1 : 1;
      const wx = targetSide * (swimVolume.halfX * (0.38 + Math.random() * 0.44));
      const wy = THREE.MathUtils.lerp(swimVolume.minY + 0.25, swimVolume.maxY - 0.2, Math.random());
      const wz = THREE.MathUtils.lerp(swimVolume.minZ * 0.68, swimVolume.maxZ * 0.68, Math.random());
      fish.waypoint.set(wx, wy, wz);
      fish.waypointTimer = 4.8 + Math.random() * 4.2;
    }

    function triggerPredatorBurst(fish, intensity = 1.0) {
      fish.state = 'STRIKE';
      fish.stateTimer = 0;
      fish.strikeDuration = 0.36 + Math.random() * 0.14;
      const tailDist = 2.4 * params.fishScale;
      spawnRipple(
        fish.pos.x - Math.sin(fish.heading) * tailDist,
        fish.pos.z - Math.cos(fish.heading) * tailDist,
        0.95 * intensity
      );
    }

    function triggerPredatorFlee(fish) {
      fish.state = 'FLEE';
      fish.stateTimer = 0;
      fish.fleeTimer = 0.95 + Math.random() * 0.35;
      fish.fleeCooldown = 0.55;
      fish.fleeHeadingOffset = (Math.random() - 0.5) * 0.55;
      const tailDist = 2.4 * params.fishScale;
      spawnRipple(
        fish.pos.x - Math.sin(fish.heading) * tailDist,
        fish.pos.z - Math.cos(fish.heading) * tailDist,
        1.15
      );
    }

    function updateTucunare(fish, dt, otherFish = null) {
      if (isInspect) {
        const isFish2 = fish.id === 2;
        if (isPiranhaProfile || (inspectFish === '1' && isFish2) || (inspectFish === '2' && !isFish2)) {
          fish.group.visible = false;
          fish.shadowGroup.visible = false;
          return;
        }
        fish.group.visible = true;
        fish.shadowGroup.visible = true;

        // Modo inspeção: tucunaré pairando para conferência visual detalhada
        fish.swimPhase += 2.2 * dt;
        fish.breathPhase += 2.4 * dt;
        fish.idleDriftPhase += 1.6 * dt;
        fish.pectRowPhase += 3.2 * dt;
        fish.uniforms.uSwimPhase.value = fish.swimPhase;
        fish.uniforms.uTailAmp.value = inspectFish === '2' ? 0.045 : 0.11;
        fish.uniforms.uSpineCurve.value = inspectFish === '2' ? 0.02 : 0.06;
        fish.uniforms.uPectoralSpread.value = 0.48;
        fish.uniforms.uPectoralRowL.value = Math.sin(fish.pectRowPhase) * 0.14;
        fish.uniforms.uPectoralRowR.value = -Math.sin(fish.pectRowPhase) * 0.14;
        fish.uniforms.uDorsalFlare.value = 0.94;
        fish.uniforms.uBreathPhase.value = fish.breathPhase;
        fish.uniforms.uIdleDriftPhase.value = fish.idleDriftPhase;
        fish.uniforms.uMouthOpen.value = isInspectMouth ? 0.95 : 0.0;

        if (inspectFish === '2') {
          const rotY2 = inspectAngle === '34' ? -Math.PI * 0.42 : -Math.PI * 0.5;
          const rotX2 = inspectAngle === '34' ? -0.04 : 0.0;
          fish.group.position.set(0, 0.0, 0);
          fish.group.rotation.set(rotX2, rotY2, 0);
          fish.group.scale.setScalar(params.fishScale * 1.12);
          fish.shadowGroup.position.set(0.95, RIVERBED_Y + 0.14, -0.45);
          fish.shadowGroup.rotation.y = rotY2;
          fish.shadowGroup.scale.setScalar(params.fishScale * 1.22);
        } else if (inspectFish === '1') {
          fish.group.position.set(0, 0.05, 0);
          fish.group.rotation.set(-0.04, Math.PI * 0.44, 0);
          fish.group.scale.setScalar(params.fishScale * 1.15);
          fish.shadowGroup.position.set(0.95, RIVERBED_Y + 0.14, -0.45);
          fish.shadowGroup.rotation.y = Math.PI * 0.44;
          fish.shadowGroup.scale.setScalar(params.fishScale * 1.25);
        } else {
          // A comparação com três peixes abre espaço entre as nadadeiras.
          const yOff = (isFish2 ? -1 : 1) * (isFishTrio ? 1.43 : 1.28);
          const rotYBoth = inspectAngle === '34' ? -Math.PI * 0.43 : -Math.PI * 0.5;
          fish.group.position.set(isFishTrio ? -2.05 : 0, yOff, 0);
          fish.group.rotation.set(0.0, rotYBoth, 0);
          fish.group.scale.setScalar(params.fishScale * 0.94);
          fish.shadowGroup.visible = false;
        }
        return;
      }

      fish.group.visible = true;
      fish.shadowGroup.visible = true;

      fish.stateTimer += dt;
      if (fish.fleeCooldown > 0) fish.fleeCooldown -= dt;

      const patrolSpeed = params.baseSpeed;
      const strikePeakSpeed = patrolSpeed * 3.2;

      // 1. Reação defensiva a movimento brusco muito próximo
      if (params.interactiveMouse && mouse.inside && mouse.moving && fish.fleeCooldown <= 0) {
        const dMouse = Math.hypot(fish.pos.x - mouse.world.x, fish.pos.z - mouse.world.z);
        if (dMouse < 3.4 && mouse.speed > 5.5) {
          triggerPredatorFlee(fish);
        }
      }

      // 2. Verifica isca na água
      let nearestBait = null;
      let nearestBaitDist = 999;
      if (fish.state !== 'FLEE' && baits.length > 0) {
        for (let i = 0; i < baits.length; i++) {
          const d = fish.pos.distanceTo(baits[i].pos);
          if (d < nearestBaitDist) {
            nearestBaitDist = d;
            nearestBait = baits[i];
          }
        }
        if (nearestBait && fish.state !== 'STALK' && fish.state !== 'STRIKE') {
          fish.state = 'STALK';
          fish.stateTimer = 0;
        }
      } else if (fish.state === 'STALK' && baits.length === 0) {
        fish.state = 'PATROL';
        fish.stateTimer = 0;
      }

      // 3. Máquina de estados
      let thrustEffort = 0.18;
      let targetDorsalFlare = 0.62;
      let targetMouthOpen = 0.0;
      let desiredDirX = Math.sin(fish.heading);
      let desiredDirZ = Math.cos(fish.heading);
      let desiredY = fish.targetY;
      if (fish.biteSnapTimer > 0) fish.biteSnapTimer = Math.max(0, fish.biteSnapTimer - dt);

      if (fish.state === 'FLEE') {
        fish.fleeTimer -= dt;
        targetDorsalFlare = 1.0;
        const fleeSpeed = patrolSpeed * 3.0;
        if (fish.stateTimer < 0.34) {
          fish.speed = THREE.MathUtils.lerp(fish.speed, fleeSpeed, Math.min(1, dt * 10.0));
          thrustEffort = 1.55;
        } else {
          fish.speed = THREE.MathUtils.lerp(fish.speed, patrolSpeed * 1.05, Math.min(1, dt * 2.6));
          thrustEffort = 0.42;
        }
        const awayAng = Math.atan2(fish.pos.x - mouse.world.x, fish.pos.z - mouse.world.z) + fish.fleeHeadingOffset;
        desiredDirX = Math.sin(awayAng);
        desiredDirZ = Math.cos(awayAng);

        if (fish.fleeTimer <= 0) {
          fish.state = 'COAST';
          fish.stateTimer = 0;
          pickPatrolWaypoint(fish);
        }
      } else if (fish.state === 'STALK' && nearestBait) {
        targetDorsalFlare = 0.98;
        const toX = nearestBait.pos.x - fish.pos.x;
        const toZ = nearestBait.pos.z - fish.pos.z;
        const horizDist = Math.max(0.01, Math.hypot(toX, toZ));
        desiredDirX = toX / horizDist;
        desiredDirZ = toZ / horizDist;
        desiredY = nearestBait.pos.y;

        const targetHeading = Math.atan2(desiredDirX, desiredDirZ);
        const headingErr = Math.abs(normalizeAngle(targetHeading - fish.heading));

        const stalkSpd = horizDist > 4.6 ? patrolSpeed * 0.88 : patrolSpeed * 0.42;
        fish.speed = THREE.MathUtils.lerp(fish.speed, stalkSpd, Math.min(1, dt * 3.2));
        thrustEffort = horizDist > 4.6 ? 0.30 : 0.12;

        if (horizDist < 4.2 && headingErr < 0.30 && fish.stateTimer > 0.38) {
          triggerPredatorBurst(fish, 1.15);
        }
      } else if (fish.state === 'STRIKE') {
        targetDorsalFlare = 1.0;
        const p = Math.min(fish.stateTimer / fish.strikeDuration, 1.0);
        const impulse = Math.sin(p * Math.PI);
        const accel = (strikePeakSpeed - patrolSpeed) * 4.8 * impulse;
        fish.speed = Math.min(strikePeakSpeed * 1.15, fish.speed + accel * dt);
        thrustEffort = 0.65 + 1.20 * impulse;

        if (nearestBait) {
          const toX = nearestBait.pos.x - fish.pos.x;
          const toZ = nearestBait.pos.z - fish.pos.z;
          const len = Math.max(0.01, Math.hypot(toX, toZ));
          desiredDirX = toX / len;
          desiredDirZ = toZ / len;
          desiredY = nearestBait.pos.y;

          const s = params.fishScale;
          const mouthX = fish.pos.x + Math.sin(fish.heading) * (2.1 * s);
          const mouthZ = fish.pos.z + Math.cos(fish.heading) * (2.1 * s);
          const mouthDist = Math.hypot(mouthX - nearestBait.pos.x, fish.pos.y - nearestBait.pos.y, mouthZ - nearestBait.pos.z);

          // Abre a boca progressivamente conforme se aproxima para engolir a isca no bote!
          if (mouthDist < 2.8 * s) {
            targetMouthOpen = THREE.MathUtils.clamp(1.0 - (mouthDist - 0.65 * s) / (2.15 * s), 0.18, 1.0);
          }

          if (mouthDist < 0.88 * s) {
            const idx = baits.indexOf(nearestBait);
            if (idx !== -1) {
              spawnStrikeSplash(nearestBait.pos.x, nearestBait.pos.y, nearestBait.pos.z);
              scene.remove(nearestBait.mesh);
              baits.splice(idx, 1);
            }
            fish.biteSnapTimer = 0.24; // Fecha a boca com firmeza e engole
            fish.state = 'COAST';
            fish.stateTimer = 0;
            pickPatrolWaypoint(fish);
          }
        }

        if (fish.state === 'STRIKE' && fish.stateTimer >= fish.strikeDuration) {
          fish.state = 'COAST';
          fish.stateTimer = 0;
        }
      } else if (fish.state === 'COAST') {
        targetDorsalFlare = 0.68;
        const floorSpd = patrolSpeed * 0.42;
        const excess = Math.max(0, fish.speed - floorSpd);
        fish.speed = floorSpd + excess * Math.exp(-1.55 * dt);
        thrustEffort = 0.06;

        const toX = fish.waypoint.x - fish.pos.x;
        const toZ = fish.waypoint.z - fish.pos.z;
        const len = Math.max(0.01, Math.hypot(toX, toZ));
        desiredDirX = toX / len;
        desiredDirZ = toZ / len;
        desiredY = fish.waypoint.y;

        if (fish.stateTimer > 1.2 && fish.speed < patrolSpeed * 0.92) {
          if (Math.random() < 0.48 * params.ambushTendency) {
            fish.state = 'HOVER';
            fish.stateTimer = 0;
            fish.hoverDuration = (2.6 + Math.random() * 3.2) * params.ambushTendency;
          } else {
            fish.state = 'PATROL';
            fish.stateTimer = 0;
          }
        }
      } else if (fish.state === 'HOVER') {
        // ESPAIRAR: suspenso quase imóvel, peitorais remando suavemente, cauda flutuando
        targetDorsalFlare = 0.74;
        fish.speed = THREE.MathUtils.lerp(fish.speed, 0.11, Math.min(1, dt * 2.5));
        thrustEffort = 0.04;
        fish.hoverDuration -= dt;

        if (params.interactiveMouse && mouse.inside && mouse.stillTime > 1.1) {
          const toX = mouse.world.x - fish.pos.x;
          const toZ = mouse.world.z - fish.pos.z;
          const len = Math.max(0.01, Math.hypot(toX, toZ));
          desiredDirX = toX / len;
          desiredDirZ = toZ / len;
          targetDorsalFlare = 0.88;
        }

        if (fish.hoverDuration <= 0) {
          fish.state = 'PATROL';
          fish.stateTimer = 0;
          fish.nextHoverIn = (4.4 + Math.random() * 4.5) / Math.max(0.3, params.ambushTendency);
          pickPatrolWaypoint(fish);
        }
      } else {
        // PATROL com ritmo orgânico de 1-2 batidas de cauda + deslize suave (kick-and-glide)
        fish.waypointTimer -= dt;
        fish.nextHoverIn -= dt;

        const dWp = Math.hypot(fish.waypoint.x - fish.pos.x, fish.waypoint.z - fish.pos.z);
        if (dWp < 1.8 || fish.waypointTimer <= 0) {
          pickPatrolWaypoint(fish);
        }

        fish.kickCycleTimer -= dt;
        if (fish.kickCycleTimer <= 0) {
          fish.kickBurstLeft = 0.45 + Math.random() * 0.45;
          fish.kickCycleTimer = 1.65 + Math.random() * 1.45;
        }
        const isKicking = fish.kickBurstLeft > 0;
        if (isKicking) fish.kickBurstLeft -= dt;

        const targetSpd = isKicking ? patrolSpeed * 1.18 : patrolSpeed * 0.78;
        fish.speed = THREE.MathUtils.lerp(fish.speed, targetSpd, Math.min(1, dt * (isKicking ? 3.2 : 1.4)));
        thrustEffort = isKicking ? 0.42 : 0.10;

        let sx = (fish.waypoint.x - fish.pos.x) / Math.max(0.01, dWp);
        let sz = (fish.waypoint.z - fish.pos.z) / Math.max(0.01, dWp);

        if (params.interactiveMouse && mouse.inside && mouse.stillTime > 1.8) {
          const ramp = Math.min(1.0, (mouse.stillTime - 1.8) / 2.2);
          const toX = mouse.world.x - fish.pos.x;
          const toZ = mouse.world.z - fish.pos.z;
          const dist = Math.max(0.1, Math.hypot(toX, toZ));
          const nx = toX / dist, nz = toZ / dist;
          const tx = -nz * fish.curiosityOrbitSign, tz = nx * fish.curiosityOrbitSign;
          if (dist > 3.2) {
            sx = THREE.MathUtils.lerp(sx, nx * 0.85 + tx * 0.35, ramp * 0.75);
            sz = THREE.MathUtils.lerp(sz, nz * 0.85 + tz * 0.35, ramp * 0.75);
          } else {
            sx = THREE.MathUtils.lerp(sx, tx, ramp * 0.75);
            sz = THREE.MathUtils.lerp(sz, tz, ramp * 0.75);
          }
          targetDorsalFlare = THREE.MathUtils.lerp(targetDorsalFlare, 0.82, ramp);
        }

        desiredDirX = sx;
        desiredDirZ = sz;
        desiredY = fish.waypoint.y;

        if (fish.nextHoverIn <= 0 && Math.abs(fish.pos.x) < swimVolume.halfX * 0.72) {
          fish.state = 'HOVER';
          fish.stateTimer = 0;
          fish.hoverDuration = (2.8 + Math.random() * 3.4) * params.ambushTendency;
        }
      }

      // 4. Contenção suave no volume isométrico
      const marginX = 2.0;
      const safeX = swimVolume.halfX - marginX;
      let steerX = desiredDirX * 3.0;
      let steerZ = desiredDirZ * 3.0;

      if (Math.abs(fish.pos.x) > safeX) {
        const over = (Math.abs(fish.pos.x) - safeX) / marginX;
        steerX -= Math.sign(fish.pos.x) * over * over * 9.5;
      }
      if (fish.pos.z > swimVolume.maxZ - 0.8) {
        const over = (fish.pos.z - (swimVolume.maxZ - 0.8)) / 0.9;
        steerZ -= over * over * 9.5;
      } else if (fish.pos.z < swimVolume.minZ + 0.8) {
        const over = ((swimVolume.minZ + 0.8) - fish.pos.z) / 0.9;
        steerZ += over * over * 9.5;
      }

      // Separação suave entre os dois tucunarés para evitar sobreposição
      if (otherFish) {
        const dxSep = fish.pos.x - otherFish.pos.x;
        const dzSep = fish.pos.z - otherFish.pos.z;
        const dHoriz = Math.hypot(dxSep, dzSep);
        if (dHoriz < 3.2 && dHoriz > 0.001) {
          const push = 1.0 - dHoriz / 3.2;
          steerX += (dxSep / dHoriz) * push * 5.2;
          steerZ += (dzSep / dHoriz) * push * 5.2;
        }
        if (dHoriz < 2.2) {
          const dySep = fish.pos.y - otherFish.pos.y;
          if (Math.abs(dySep) < 0.8) {
            desiredY += (fish.id === 2 ? -1 : 1) * 0.45 * (1.0 - dHoriz / 2.2);
          }
        }
      }

      const desiredHeading = Math.atan2(steerX, steerZ);
      const angleDiff = normalizeAngle(desiredHeading - fish.heading);

      const maxTurn = fish.state === 'FLEE' || fish.state === 'STRIKE' ? 3.4 : (fish.state === 'HOVER' ? 0.85 : 1.55);
      const turnGain = fish.state === 'FLEE' || fish.state === 'STRIKE' ? 3.8 : (fish.state === 'HOVER' ? 1.15 : 1.85);
      const targetAngVel = THREE.MathUtils.clamp(angleDiff * turnGain, -maxTurn, maxTurn);
      fish.angularVelocity = THREE.MathUtils.lerp(fish.angularVelocity, targetAngVel, Math.min(1, dt * 4.5));

      fish.heading = normalizeAngle(fish.heading + fish.angularVelocity * dt);
      fish.pos.x += Math.sin(fish.heading) * fish.speed * dt;
      fish.pos.z += Math.cos(fish.heading) * fish.speed * dt;

      const clampedDesiredY = THREE.MathUtils.clamp(desiredY, swimVolume.minY, swimVolume.maxY);
      const targetVelY = THREE.MathUtils.clamp((clampedDesiredY - fish.pos.y) * 1.1, -1.0, 1.0);
      fish.velY = THREE.MathUtils.lerp(fish.velY, targetVelY, Math.min(1, dt * 2.2));
      fish.pos.y = THREE.MathUtils.clamp(fish.pos.y + fish.velY * dt, swimVolume.minY, swimVolume.maxY);

      const hoverPitchBias = fish.state === 'HOVER' ? -0.05 : 0.0;
      const targetPitch = THREE.MathUtils.clamp(-fish.velY / Math.max(1.2, fish.speed + 0.8) * 0.40 + hoverPitchBias, -0.24, 0.22);
      fish.pitch = THREE.MathUtils.lerp(fish.pitch, targetPitch, Math.min(1, dt * 3.4));

      const targetRoll = THREE.MathUtils.clamp(-fish.angularVelocity * 0.14 * Math.min(1, fish.speed * 0.5), -0.22, 0.22);
      fish.roll = THREE.MathUtils.lerp(fish.roll, targetRoll, Math.min(1, dt * 3.8));

      const rawAccel = (fish.speed - fish.prevSpeed) / Math.max(dt, 0.001);
      fish.acceleration = THREE.MathUtils.lerp(fish.acceleration, rawAccel, Math.min(1, dt * 7.5));
      fish.prevSpeed = fish.speed;

      // 5. Acoplamento corpo-física
      const accelBoost = Math.max(0, fish.acceleration) * 0.18;
      const targetEffort = THREE.MathUtils.clamp(thrustEffort + accelBoost, 0.03, 1.85);
      fish.smoothEffort = THREE.MathUtils.lerp(fish.smoothEffort, targetEffort, Math.min(1, dt * 5.8));

      const swimFreq = 1.8 + fish.smoothEffort * 8.6;
      fish.swimPhase += swimFreq * dt;
      fish.breathPhase += (2.3 + fish.smoothEffort * 2.0) * dt;
      fish.idleDriftPhase += 1.55 * dt;

      const tailAmp = 0.045 + fish.smoothEffort * 0.30;
      fish.smoothSpineCurve = THREE.MathUtils.lerp(fish.smoothSpineCurve, fish.angularVelocity * 0.48, Math.min(1, dt * 5.8));
      fish.smoothDorsalFlare = THREE.MathUtils.lerp(fish.smoothDorsalFlare, targetDorsalFlare, Math.min(1, dt * 4.2));

      const fastMode = fish.state === 'STRIKE' || fish.state === 'FLEE';
      const hoverMode = fish.state === 'HOVER' || fish.state === 'STALK';
      const targetSpread = fastMode ? 0.05 : (hoverMode ? 0.56 : 0.34);
      fish.smoothPectSpread = THREE.MathUtils.lerp(fish.smoothPectSpread, targetSpread, Math.min(1, dt * 4.2));

      fish.pectRowPhase += (hoverMode ? 3.5 : 2.0) * dt;
      const rowAmp = fastMode ? 0.03 : (hoverMode ? 0.24 : 0.10);
      const scull = Math.sin(fish.pectRowPhase) * rowAmp;
      const turnL = Math.max(0, fish.angularVelocity) * 0.22;
      const turnR = Math.max(0, -fish.angularVelocity) * 0.22;

      // Animação suave da abertura da boca (abre rápido no bote e fecha firme ao abocanhar)
      const mouthLerpRate = targetMouthOpen > fish.smoothMouthOpen ? 13.0 : (fish.biteSnapTimer > 0 ? 18.0 : 8.5);
      fish.smoothMouthOpen = THREE.MathUtils.lerp(fish.smoothMouthOpen, targetMouthOpen, Math.min(1, dt * mouthLerpRate));

      fish.uniforms.uSwimPhase.value = fish.swimPhase;
      fish.uniforms.uTailAmp.value = tailAmp;
      fish.uniforms.uSpineCurve.value = fish.smoothSpineCurve;
      fish.uniforms.uPectoralSpread.value = fish.smoothPectSpread;
      fish.uniforms.uPectoralRowL.value = scull + turnL;
      fish.uniforms.uPectoralRowR.value = -scull + turnR;
      fish.uniforms.uDorsalFlare.value = fish.smoothDorsalFlare;
      fish.uniforms.uBreathPhase.value = fish.breathPhase;
      fish.uniforms.uIdleDriftPhase.value = fish.idleDriftPhase;
      fish.uniforms.uMouthOpen.value = fish.smoothMouthOpen;

      // Informa a posição de cada tucunaré para as algas balançarem na sua esteira
      if (fish.id === 2) {
        algaeUniforms.uFishPos2.value.copy(fish.pos);
      } else {
        algaeUniforms.uFishPos.value.copy(fish.pos);
      }

      // 6. Transformações 3D + sombra no leito arenoso
      const s = params.fishScale;
      const bobY = Math.sin(clockTime * 1.4) * 0.04;
      const finalY = fish.pos.y + bobY;

      fish.group.position.set(fish.pos.x, finalY, fish.pos.z);
      fish.group.rotation.set(fish.pitch, fish.heading, fish.roll);
      fish.group.scale.setScalar(s);

      const heightAboveBed = Math.max(0.4, finalY - RIVERBED_Y);
      const shadowSpread = 1.0 + heightAboveBed * 0.08;
      fish.shadowGroup.position.set(
        fish.pos.x + heightAboveBed * 0.30,
        RIVERBED_Y + 0.14,
        fish.pos.z - heightAboveBed * 0.16
      );
      fish.shadowGroup.rotation.y = fish.heading;
      fish.shadowGroup.scale.set(s * shadowSpread, s, s * shadowSpread);
      fish.shadowMat.uniforms.uShadowOpacity.value = THREE.MathUtils.clamp(0.34 - heightAboveBed * 0.042, 0.10, 0.32);
    }

    // =========================================================================
    // 10. PAINEL LIL-GUI + LIVELY WALLPAPER API
    // =========================================================================
    let gui = null;
    const guiControllers = {};

    function initGui() {
      try {
        const { GUI } = window.lil;
        gui = new GUI({ title: 'Tucunaré Azul · Controles', width: 265 });

        guiControllers.baseSpeed = gui.add(params, 'baseSpeed', 0.8, 3.8, 0.05).name('Velocidade Patrulha');
        guiControllers.ambushTendency = gui.add(params, 'ambushTendency', 0.2, 1.8, 0.05).name('Tendência Emboscada');
        guiControllers.causticsIntensity = gui.add(params, 'causticsIntensity', 0.0, 2.2, 0.05).name('Cáusticas').onChange(syncEnvUniforms);
        guiControllers.sunbeamsIntensity = gui.add(params, 'sunbeamsIntensity', 0.0, 2.0, 0.05).name('Raios de Luz').onChange(syncEnvUniforms);
        guiControllers.fishScale = gui.add(params, 'fishScale', 0.6, 1.6, 0.05).name('Tamanho Tucunaré');
        guiControllers.showAlgae = gui.add(params, 'showAlgae').name('Algas no Fundo').onChange(syncAlgaeVisibility);
        guiControllers.interactiveMouse = gui.add(params, 'interactiveMouse').name('Interação Mouse');
        gui.add(params, 'dropBaitCenter').name('Soltar Isca');
        gui.add(params, 'triggerStrike').name('Disparar Bote');

        gui.close();
        syncGuiVisibility();
      } catch (err) {
        console.warn('lil-gui indisponível:', err);
      }
    }

    function syncAlgaeVisibility() {
      algaeMesh.visible = Boolean(params.showAlgae);
    }

    function syncEnvUniforms() {
      riverbedUniforms.uCausticsIntensity.value = params.causticsIntensity;
      waterSurfaceUniforms.uCausticsIntensity.value = params.causticsIntensity;
      backdropUniforms.uCausticsIntensity.value = params.causticsIntensity;
      globalFishUniforms.uCausticsIntensity.value = params.causticsIntensity;
      algaeUniforms.uCausticsIntensity.value = params.causticsIntensity;
      sunbeamUniforms.uIntensity.value = params.sunbeamsIntensity;
    }

    function syncGuiVisibility() {
      if (!gui) return;
      gui.domElement.classList.toggle('hidden-gui', !params.showGui);
    }

    window.livelyPropertyListener = function (name, val) {
      if (name === 'baseSpeed') {
        params.baseSpeed = (Number(val) / 100) * 1.85;
      } else if (name === 'ambushTendency') {
        params.ambushTendency = Number(val) / 100;
      } else if (name === 'causticsIntensity') {
        params.causticsIntensity = Number(val) / 100;
        syncEnvUniforms();
      } else if (name === 'sunbeamsIntensity') {
        params.sunbeamsIntensity = Number(val) / 100;
        syncEnvUniforms();
      } else if (name === 'fishScale') {
        params.fishScale = Number(val) / 100;
      } else if (name === 'showAlgae') {
        params.showAlgae = Boolean(val);
        syncAlgaeVisibility();
      } else if (name === 'interactiveMouse') {
        params.interactiveMouse = Boolean(val);
      } else if (name === 'showGui') {
        params.showGui = Boolean(val);
        syncGuiVisibility();
      }
      if (guiControllers[name]) guiControllers[name].updateDisplay();
    };

    window.addEventListener('keydown', (e) => {
      if (e.key === 'p' || e.key === 'P' || e.key === 'h' || e.key === 'H') {
        params.showGui = !params.showGui;
        syncGuiVisibility();
      } else if (e.code === 'Space') {
        params.dropBaitCenter();
      }
    });

    initGui();

    // =========================================================================
    // 11. RESIZE E LOOP PRINCIPAL
    // =========================================================================
    function onResize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      updateBounds();
      moteUniforms.uPixelRatio.value = renderer.getPixelRatio();
    }
    window.addEventListener('resize', onResize);

    let lastNow = performance.now();
    let clockTime = 0;

    function animate(now) {
      requestAnimationFrame(animate);
      const dt = Math.min((now - lastNow) * 0.001, 0.05);
      lastNow = now;
      clockTime += dt;

      // Micro-flutuação sutil de lente subaquática (ou órbita livre em inspeção)
      if (!isInspect) {
        camera.position.set(
          CAM_BASE.x + Math.sin(clockTime * 0.25) * 0.14,
          CAM_BASE.y + Math.cos(clockTime * 0.19) * 0.09,
          CAM_BASE.z
        );
        camera.lookAt(CAM_TARGET);
      } else {
        const off = inspectBaseOffset.clone().multiplyScalar(inspectOrbit.zoom);
        const cosP = Math.cos(inspectOrbit.pitch);
        const sinP = Math.sin(inspectOrbit.pitch);
        const y1 = off.y * cosP - off.z * sinP;
        const z1 = off.y * sinP + off.z * cosP;
        const cosY = Math.cos(inspectOrbit.yaw);
        const sinY = Math.sin(inspectOrbit.yaw);
        const x2 = off.x * cosY + z1 * sinY;
        const z2 = -off.x * sinY + z1 * cosY;
        camera.position.set(CAM_TARGET.x + x2, CAM_TARGET.y + y1, CAM_TARGET.z + z2);
        camera.lookAt(CAM_TARGET);
      }

      riverbedUniforms.uTime.value = clockTime;
      waterSurfaceUniforms.uTime.value = clockTime;
      backdropUniforms.uTime.value = clockTime;
      sunbeamUniforms.uTime.value = clockTime;
      globalFishUniforms.uTime.value = clockTime;
      algaeUniforms.uTime.value = clockTime;
      moteUniforms.uTime.value = clockTime;

      updateMouseState(dt);
      updateBaitsAndBubbles(dt);
      updateTucunare(tucunare, dt, tucunareRealista);
      updateTucunare(tucunareRealista, dt, tucunare);
      posePiranha(clockTime);

      renderer.render(scene, camera);
    }

    requestAnimationFrame(animate);
    })();
  </script>
