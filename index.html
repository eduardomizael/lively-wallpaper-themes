<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Circuit Orbit · Impact HUD</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body class="with-grid">
  <canvas id="atmosphere" aria-hidden="true"></canvas>
  <canvas id="mouse-fluid" aria-hidden="true"></canvas>
  <canvas id="shot-fluid" aria-hidden="true"></canvas>
  <canvas id="scene" aria-label="Disparos de laser entre displays futuristas dos ícones"></canvas>
  <aside id="notice" hidden></aside>
  <section id="controls" hidden>
    <header><span class="eyebrow">IMPACT HUD · PULSE NETWORK</span><h1>Circuit Orbit<span> / 02</span></h1><p>Carrega. Dispara. Acende.</p></header>
    <label>Cor dos efeitos <input id="accent" type="color" value="#49e5ff"></label>
    <label>Velocidade do tiro <input id="speed" type="range" min="40" max="800" step="10" value="160"></label>
    <label>Brilho <input id="glow" type="range" min="10" max="100" value="70"></label>
    <label>Rastro do tiro <input id="trail" type="range" min="60" max="700" value="180"></label>
    <label>Efeito do tiro <select id="shotStyle"><option value="0">Laser</option><option value="1" selected>Energia fluida</option></select></label>
    <label>Marcador <select id="markerStyle"><option value="0">Display futurista</option><option value="1" selected>Núcleo de névoa</option></select></label>
    <label>Tamanho do marcador (%) <input id="circleSize" type="range" min="40" max="200" step="5" value="100"></label>
    <label>Tempo de carga (ms) <input id="chargeTime" type="range" min="300" max="2400" step="100" value="1000"></label>
    <label>Permanência (%) <input id="persistencePercent" type="range" min="1" max="99" step="1" value="60"></label>
    <label>Quadros por segundo <select id="frameRate"><option value="0">30 FPS</option><option value="1" selected>60 FPS</option></select></label>
    <label>Área <select id="monitor"><option value="0">Automático</option><option value="1">Todos — área estendida</option></select></label>
    <label>Grade sutil <input id="grid" type="checkbox" checked></label>
    <h2 class="control-section">Ambiente</h2>
    <label>Névoa de energia (%) <input id="fogStrength" type="range" min="0" max="100" step="5" value="45"></label>
    <label>Partículas de energia <input id="dustCount" type="range" min="0" max="70" step="1" value="32"></label>
    <label>Ondas de impacto (%) <input id="impactStrength" type="range" min="0" max="100" step="5" value="40"></label>
    <label>Névoa do mouse <input id="mouseFog" type="checkbox" checked></label>
    <label>Explosão ao clicar <input id="clickBurst" type="checkbox" checked></label>
    <label>Intensidade do mouse (%) <input id="mouseFogStrength" type="range" min="0" max="100" step="5" value="35"></label>
    <label>Tamanho da nuvem (px) <input id="mouseFogSize" type="range" min="60" max="500" step="10" value="260"></label>
    <button id="collectIcons">Coletar posições dos ícones</button>
    <p id="collectStatus" role="status" aria-live="polite"></p>
    <footer id="status">Aguardando mapa da área de trabalho…</footer>
    <button id="hide">Ocultar controles · tecla P para voltar</button>
  </section>
  <script src="engine.js"></script>
  <script src="atmosphere.js"></script>
  <script src="mouse-fluid.js"></script>
  <script src="shot-fluid.js"></script>
  <script src="nucleus.js"></script>
  <script src="hud.js"></script>
  <script src="app.js"></script>
</body>
</html>
